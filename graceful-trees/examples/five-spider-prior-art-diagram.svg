<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title description">
  <title id="title">The older construction: join a path to make a three-leg spider</title>
  <desc id="description">Before: a five-edge leg has hub zero and a ten-edge path has zero at its middle. Merge those two zero vertices into one hub and apply the established relabeling. The resulting hub is four and every leg has five edges. On the lower right leg, zero is two steps from the hub and fifteen is three steps from the hub. All vertex labels zero through fifteen and edge differences one through fifteen occur exactly once. This is an example of a consequence of prior work, not a new theorem.</desc>
