    <g id="land" fill="#66ff33" shape-rendering="crispEdges">
      <path d="M2 8h13v3h5v6h-5v4h-4v5H7v-7H2zm11 20h8v3h4v7h-4v5h-4v-8h-4zM29 4h10v4h5v6h-7v3h-6v-5h-5V8h3zm1 16h11v4h4v8h-4v6h-6v-9h-5zm14 17h4v4h-4z"/>
