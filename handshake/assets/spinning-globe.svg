<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="ocean" cx="32%" cy="28%" r="75%">
      <stop stop-color="#66ffff"/>
      <stop offset=".4" stop-color="#0066ff"/>
      <stop offset="1" stop-color="#000066"/>
    </radialGradient>
    <radialGradient id="shade" cx="30%" cy="25%" r="75%">
      <stop offset=".4" stop-color="#000" stop-opacity="0"/>
