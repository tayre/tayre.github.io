name: Parallel graceful research experiments

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/graceful-experiments.yml'
      - 'graceful-trees/src/graceful_research/matching_lift.py'
      - 'graceful-trees/src/graceful_research/rooted_spiders.py'
      - 'graceful-trees/src/graceful_research/residual_congruence*.py'
      - 'graceful-trees/scripts/experiment_matching_lift.py'
      - 'graceful-trees/scripts/experiment_spider_roots.py'
      - 'graceful-trees/scripts/experiment_residual_congruence.py'
      - 'graceful-trees/tests/test_matching_lift.py'
      - 'graceful-trees/tests/test_rooted_spiders.py'
      - 'graceful-trees/tests/test_residual_congruence.py'

permissions:
  contents: read

concurrency:
  group: graceful-experiments-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    name: ${{ matrix.experiment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - experiment: matching-lift
            script: experiment_matching_lift.py
            test: test_matching_lift.py
          - experiment: spider-roots
            script: experiment_spider_roots.py
            test: test_rooted_spiders.py
          - experiment: residual-congruence
            script: experiment_residual_congruence.py
            test: test_residual_congruence.py
    defaults:
      run:
        working-directory: graceful-trees
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      EXPERIMENT: ${{ matrix.experiment }}
      EXPERIMENT_SCRIPT: ${{ matrix.script }}
      EXPERIMENT_TEST: ${{ matrix.test }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: graceful-trees/requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Check the experiment independently
        run: python -m pytest -q "tests/$EXPERIMENT_TEST"
      - name: Run the bounded experiment
        run: python "scripts/$EXPERIMENT_SCRIPT" --output "results/$EXPERIMENT"
      - name: Save inputs, results and verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: graceful-experiment-${{ matrix.experiment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: graceful-trees/results/${{ matrix.experiment }}/
          retention-days: 14
          if-no-files-found: warn
