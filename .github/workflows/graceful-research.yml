name: Graceful tree research

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/graceful-research.yml'
      - 'graceful-trees/configs/nightly.json'
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment configuration
        type: choice
        options: [nightly, smoke, exhaustive-small, edge-profiles]
        default: nightly
      budget_minutes:
        description: Compute budget in minutes (1 through 30)
        type: number
        default: 30

permissions:
  contents: read
  actions: read

concurrency:
  group: graceful-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      campaign: ${{ steps.parameters.outputs.campaign }}
      artifact_id: ${{ steps.results.outputs.artifact-id }}
      audit_outcome: ${{ steps.audit.outcome }}
    defaults:
      run:
        working-directory: graceful-trees
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      EXPERIMENT: ${{ inputs.experiment || 'nightly' }}
      MINUTES: ${{ github.event_name == 'push' && '2' || inputs.budget_minutes }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: graceful-trees/requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Validate workflow inputs
        id: parameters
        run: python scripts/cloud_run.py --prepare
      - name: Test mathematical and operational invariants
        run: python -m pytest -q
      - name: Restore cumulative checkpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CAMPAIGN: ${{ steps.parameters.outputs.campaign }}
        run: python scripts/restore_checkpoint.py --campaign "$CAMPAIGN" --destination results/previous.sqlite
      - name: Run bounded research
        id: research
        run: python scripts/cloud_run.py
      - name: Independently audit results
        id: audit
        if: always() && steps.research.outcome != 'skipped'
        run: python -m graceful_research audit results/current
      - name: Preserve cumulative checkpoint
        if: success() && steps.audit.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: graceful-checkpoint-${{ steps.parameters.outputs.campaign }}
          path: |
            graceful-trees/results/current/research.sqlite
            graceful-trees/results/current/checkpoint.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Preserve reports and evidence, including failed runs
        id: results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: graceful-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            graceful-trees/results/current/
            graceful-trees/results/restore-status.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 9
      - name: Publish run summary with visual report download
        if: always()
        env:
          RESULTS_ARTIFACT_URL: ${{ steps.results.outputs.artifact-url }}
        run: python scripts/publish_summary.py

  dashboard:
    name: Publish public progress
    needs: research
    if: needs.research.result == 'success' && needs.research.outputs.audit_outcome == 'success' && needs.research.outputs.campaign == 'nightly-v1' && github.ref == 'refs/heads/master'
    # Publishing must not invalidate an audited checkpoint if GitHub is unavailable.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Publish audited statistics to the data branch
        working-directory: graceful-trees
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESULTS_ARTIFACT_ID: ${{ needs.research.outputs.artifact_id }}
          AUDIT_OUTCOME: ${{ needs.research.outputs.audit_outcome }}
        run: python3 scripts/publish_dashboard.py

  notify:
    name: Review notable findings
    needs: research
    if: always()
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Report new findings to the repository owner
        # Delivery trouble must not invalidate a successfully audited checkpoint.
        continue-on-error: true
        working-directory: graceful-trees
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_RECIPIENT: ${{ vars.GRACEFUL_ALERT_RECIPIENT || github.repository_owner }}
          CAMPAIGN: ${{ needs.research.outputs.campaign }}
          RESULTS_ARTIFACT_ID: ${{ needs.research.outputs.artifact_id }}
          AUDIT_OUTCOME: ${{ needs.research.outputs.audit_outcome }}
          RESEARCH_OUTCOME: ${{ needs.research.result }}
        run: python3 scripts/notify_findings.py
