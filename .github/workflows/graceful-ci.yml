name: Graceful tree tests

on:
  push:
    paths: ['graceful-trees/**', '.github/workflows/graceful-*.yml']
  pull_request:
    paths: ['graceful-trees/**', '.github/workflows/graceful-*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: graceful-trees
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: graceful-trees/requirements.lock
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
      - name: Exercise the installed CLI
        run: |
          graceful-research run --config configs/exhaustive-small.json --output results/ci --budget-seconds 20 --max-cases 25
          graceful-research audit results/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: graceful-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: graceful-trees/results/ci/
          retention-days: 7
          if-no-files-found: warn
