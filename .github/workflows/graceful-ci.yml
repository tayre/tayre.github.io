name: Graceful tree tests

on:
  push:
    paths: ['index.html', 'graceful-trees/**', '.github/workflows/graceful-*.yml']
  pull_request:
    paths: ['index.html', 'graceful-trees/**', '.github/workflows/graceful-*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: graceful-trees
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: graceful-trees/requirements.lock
      - run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
      - name: Check public dashboard data and mathematical example
        run: node --test site/test/data.test.mjs
      - name: Exercise the installed CLI
        run: |
          graceful-research run --config configs/exhaustive-small.json --output results/ci --budget-seconds 20 --max-cases 25
          graceful-research audit results/ci
          graceful-research run --config configs/sat-certificates.json --output results/ci-sat --budget-seconds 20
          graceful-research audit results/ci-sat
          python3 -S results/ci-sat/proof_verify.py results/ci-sat/unsat-certificates
          graceful-research run --config configs/leaf-tail.json --output results/ci-leaf --budget-seconds 20 --max-cases 25
          graceful-research audit results/ci-leaf
          python scripts/experiment_residual_signatures.py --output results/ci-signatures
          graceful-research run --config configs/swap-search.json --output results/ci-swaps --budget-seconds 20 --max-cases 25
          graceful-research audit results/ci-swaps
          python scripts/experiment_rooted_pairings.py --output results/ci-pairings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: graceful-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            graceful-trees/results/ci/
            graceful-trees/results/ci-sat/
            graceful-trees/results/ci-leaf/
            graceful-trees/results/ci-signatures/
            graceful-trees/results/ci-swaps/
            graceful-trees/results/ci-pairings/
          retention-days: 7
          if-no-files-found: warn

  formal:
    name: Lean proofs and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: graceful-trees
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Install checksum-pinned Lean 4.24.0
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/leanprover/lean4/releases/download/v4.24.0/lean-4.24.0-linux.tar.zst \
            --output "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' b14f5e5159219dd1a1956c3b806813319f5e94ccd5bdfd56f54520609a5bb5ec "$RUNNER_TEMP/lean.tar.zst" | sha256sum --check --status
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
      - name: Rebuild proofs and reject extra axioms
        run: python scripts/check_proofs.py --lake "$RUNNER_TEMP/lean-4.24.0-linux/bin/lake" --output results/proofs
      - name: Test rejection of unfinished and untrusted proofs
        run: |
          python -m pip install pytest==8.4.2
          GRACEFUL_LAKE="$RUNNER_TEMP/lean-4.24.0-linux/bin/lake" python -m pytest -q tests/test_formal.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: graceful-proofs-${{ github.run_id }}-${{ github.run_attempt }}
          path: graceful-trees/results/proofs/
          retention-days: 14
          if-no-files-found: warn
